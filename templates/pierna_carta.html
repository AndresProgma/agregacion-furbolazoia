<div class="card" style="width: 15rem;">
  <div class="card-body py-2">
    <h6 class="card-title mb-1">{{ piernas.partido }}</h6>
    <p class="card-text mb-1"><small class="text-secondary">{{ piernas.mercado }}</small></p>
    <p class="card-text mb-1">cuota: {{ piernas.cuota }} · prob: {{ piernas.prob }}</p>
    <p class="card-text mb-2">resultado:
      <span class="badge text-bg-secondary">{{ piernas.resultado.value if piernas.resultado else "pendiente" }}</span>
    </p>

    {# Boton ELIMINAR: form POST. El confirm() pide confirmacion antes de borrar #}
    <form method="post" action="/Pierna/{{ piernas.id }}/eliminar"
          onsubmit="return confirm('¿Eliminar esta pierna?');">
        <button type="submit" class="btn btn-danger btn-sm w-100">Eliminar</button>
    </form>
  </div>
</div>
