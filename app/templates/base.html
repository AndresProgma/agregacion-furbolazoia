<!DOCTYPE html>
{# data-bs-theme="dark" = activa el MODO OSCURO de Bootstrap en toda la pagina #}
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>combinadas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {# Pequeños retoques para imitar el fondo verde-oscuro y el acento verde del sitio de referencia #}
    <style>
        body            { background-color: #0a1410; }   /* fondo casi negro con tinte verde */
        .card,
        .navbar,
        footer          { background-color: #0f1d16 !important; }  /* superficies un poco mas claras */
        .btn-success    { background-color: #16a34a; border-color: #16a34a; }  /* verde cesped */
        .navbar-brand   { color: #22c55e; font-weight: bold; }
    </style>
</head>
<div class="content">
    {% include 'navbar.html' %}

    <main>
        {% block content %} {% endblock %}
    </main>
{% include 'footer.html' %}

</div>

</body>
</html>
